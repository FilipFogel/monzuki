<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#1b2c24"><title>Elemental Duel</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#132019;color:#fff1d1;font-family:system-ui,Arial,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}#game{position:absolute;inset:0;background:#9b7546 url('arena.png') center/100% 100% no-repeat;overflow:hidden}#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,18,17,.22),transparent 22%,transparent 78%,rgba(5,18,17,.3));pointer-events:none}.hud{position:absolute;left:1%;right:1%;height:8%;display:flex;align-items:center;justify-content:space-between;z-index:3;gap:8px}.top{top:1%}.bottom{bottom:1%}.badge{background:linear-gradient(#263c37,#142521);border:2px solid #c8a36a;box-shadow:0 3px 8px #0009;border-radius:12px;padding:5px 12px;font-size:clamp(11px,1.45vw,17px);font-weight:750;white-space:nowrap}.btn{border:2px solid #f6dc99;border-radius:10px;background:linear-gradient(#ffde91,#bc7a32);color:#302113;font-weight:850;padding:6px 14px;box-shadow:0 3px 8px #0007;font-size:clamp(11px,1.35vw,16px)}.btn:disabled{filter:grayscale(1);opacity:.5}.row{position:absolute;left:18%;right:18%;display:flex;justify-content:center;align-items:center;gap:2.4%;height:29%;z-index:2}.enemy{top:10%}.mine{top:47%}.slot{flex:0 0 auto;height:100%;aspect-ratio:.81;min-width:0;max-width:29%;border:2px dashed #ffffff80;border-radius:10px;background:#453d2940;display:flex;align-items:center;justify-content:center;color:#fff9;font-size:12px}.card{position:relative;flex:0 0 auto;width:auto;aspect-ratio:.81;max-width:29%;min-width:0;height:100%;border:3px solid #b98943;border-radius:11px;background:linear-gradient(#f9e3b4,#b18c58);box-shadow:0 5px 12px #0009;overflow:hidden;color:#2c2116;display:flex;flex-direction:column;user-select:none;transition:transform .14s}.card.selected{border-color:#9dff78;box-shadow:0 0 0 2px #60e74c,0 0 16px #79ff76;transform:translateY(-3px)}.card.target{border-color:#ff8585;box-shadow:0 0 15px #f33}.card .name{height:18%;font-weight:900;text-align:center;font-size:clamp(10px,1.22vw,17px);background:#f8dfa7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px}.card img{width:100%;height:61%;object-fit:contain;background:#584c36}.card .stats{height:21%;padding:2px 5px;background:#2b2922;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:3px}.health{height:5px;border-radius:6px;background:#6d302d;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#64d449,#b1fa56);transition:width .45s}.numbers{display:flex;justify-content:space-between;align-items:center;font-size:clamp(9px,1.08vw,14px);font-weight:800}.hit{animation:hit .45s}.hit .stats{animation:redden .6s}.damage{position:absolute;z-index:10;left:50%;top:42%;transform:translate(-50%,-50%);color:#ff3232;font-size:clamp(25px,4.5vw,66px);font-weight:1000;text-shadow:2px 3px 0 #420000,0 0 12px #fff;pointer-events:none;animation:float 1s ease-out forwards}@keyframes hit{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}@keyframes redden{0%,70%{background:#b82120}100%{background:#2b2922}}@keyframes float{0%{opacity:0;transform:translate(-50%,-35%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-125%) scale(1)}}
#hand{position:absolute;left:16%;right:16%;bottom:0.5%;height:18%;display:flex;justify-content:center;gap:8px;z-index:4;pointer-events:none}#hand .handcard{pointer-events:auto;min-width:0;flex:0 1 100px;border:2px solid #f7d68c;border-radius:8px;overflow:hidden;background:#efd49d;color:#2e2214;text-align:center;font-weight:800;font-size:clamp(9px,1vw,12px);box-shadow:0 3px 9px #0009}#hand{height:25%;left:23%;right:19%}#hand .handcard{flex-basis:125px;padding:0;display:flex;flex-direction:column}#hand img{height:43%;width:100%;object-fit:cover;min-height:0}#hand .handname{font-size:clamp(10px,1.1vw,14px)}#hand .handstats{flex:1;background:#202d28;color:#fff1d1;padding:2px 4px;font-size:clamp(9px,1vw,13px);line-height:1.25;text-align:left}#hand .handstats span{display:flex;justify-content:space-between;gap:3px}#info{bottom:10%;height:14%}.topcontrols{display:flex;gap:6px}#music{min-width:85px}#hand span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mine{top:43%;height:26%}.enemy{height:26%}#actions{position:absolute;bottom:1%;right:1%;width:16%;z-index:5;display:flex;flex-direction:column;gap:5px}#actions .btn{padding:5px;font-size:clamp(10px,1.12vw,14px)}#info{position:absolute;bottom:10%;left:1%;width:20%;height:14%;z-index:5;background:#14251fe0;border:1px solid #c6a468;border-radius:9px;padding:5px;font-size:clamp(10px,1.1vw,14px);overflow:auto}#notice{position:absolute;left:35%;right:35%;top:40%;text-align:center;background:#15251de8;color:#ffe8a2;padding:9px;border:2px solid #e3ba6d;border-radius:9px;z-index:8;font-weight:850;display:none}#overlay{position:absolute;inset:0;background:#0b1715d9;display:flex;align-items:center;justify-content:center;z-index:20}#menu{width:min(720px,92%);max-height:90%;overflow:auto;background:linear-gradient(#284039,#152b27);border:3px solid #cba365;border-radius:16px;padding:20px;text-align:center;box-shadow:0 15px 45px #000c}h1{font-size:clamp(24px,4vw,38px);margin:4px}p{margin:8px}.decks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.deckbtn{background:#e5c992;border:2px solid #a77739;border-radius:12px;padding:12px;color:#292016;font-weight:900;font-size:clamp(13px,1.6vw,19px)}.deckbtn small{display:block;font-weight:500}.deckbtn:active{background:#fff0c1}#rotate{display:none;position:absolute;inset:0;z-index:50;background:#14251f;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:23px;font-weight:800}@media(orientation:portrait){#rotate{display:flex}}@media(max-height:380px){.hud{height:9%}.row{height:25%}.enemy{top:10%}.mine{top:42%}#hand{height:27%}}

/* Shared illustrated card face, with full uncropped artwork. */
.row.enemy{top:10%;height:25%}.row.mine{top:39%;height:25%}
#hand{left:23%;right:19%;bottom:1%;height:29%;gap:8px;align-items:center}
.card,#hand .handcard{aspect-ratio:.82;width:auto;height:100%;flex:0 1 auto;max-width:29%;padding:0;display:flex;flex-direction:column;border:2px solid #d6b477;border-radius:9px;background:linear-gradient(110deg,#f9eac5,#d2ad70);overflow:hidden;color:#342510}
#hand .handcard{max-width:19%;flex-shrink:1}
.cardtitle{height:15%;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 4px;gap:3px;font-weight:900;font-size:clamp(8px,1.05vw,14px)}
.cardtitle>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpbadge{color:#9c2421;white-space:nowrap;font-size:clamp(8px,.95vw,13px)}
.card img,#hand img{display:block;height:56%;width:100%;flex-shrink:0;object-fit:contain;background:#263c37}
.attacklist{height:26%;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 3px;background:linear-gradient(100deg,#f9eccb,#dec18d)}
.attackline{display:flex;align-items:center;gap:3px;min-height:0;flex:1;border-top:1px solid #ad8c55;font-size:clamp(7px,.82vw,11px);font-weight:750}
#hand .attackline span{display:inline;white-space:nowrap}
.gems{color:#287cb0;text-shadow:0 1px #fff;font-size:clamp(8px,.9vw,12px);min-width:18%;letter-spacing:-2px}
.attackname{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:left}
.damagebadge{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;background:#bb3024;min-width:17px;height:90%;padding:0 3px;clip-path:polygon(50% 0,65% 15%,90% 10%,85% 35%,100% 50%,85% 65%,90% 90%,65% 85%,50% 100%,35% 85%,10% 90%,15% 65%,0 50%,15% 35%,10% 10%,35% 15%)}
.card>.health,#hand .health{height:3%;min-height:2px;margin:0;border-radius:0;flex-shrink:0}
@media(max-height:380px){#hand{height:29%}.row.enemy{height:25%}.row.mine{top:39%;height:25%}}
</style></head><body><div id="game"><div id="shade"></div><div class="hud top"><div id="enemyhud" class="badge">Motståndare</div><div class="badge" id="turn">Elemental Duel</div><div class="topcontrols"><button class="btn" id="music" aria-pressed="false" onclick="toggleMusic()">♫ Musik: av</button><button class="btn" onclick="showMenu()">Ny match</button></div></div><div id="enemyrow" class="row enemy"></div><div id="myrow" class="row mine"></div><div class="hud bottom"><div id="myhud" class="badge">Du</div></div><div id="info">Välj en kortlek för att börja.</div><div id="hand"></div><div id="actions"><button class="btn" id="a1" onclick="attack(0)">Attack 1</button><button class="btn" id="a2" onclick="attack(1)">Attack 2</button><button class="btn" id="end" onclick="endTurn()">Avsluta tur</button></div><div id="notice"></div><div id="overlay"><div id="menu"><h1>✦ Elemental Duel</h1><p>Välj kortlek · Spela ut kort · Välj angripare och mål · Attackera</p><div class="decks" id="deckmenu"></div><p style="font-size:12px;opacity:.8">Spelbar landskapsprototyp · 24 varelser · Ingen hjälte</p></div></div><div id="rotate">Vrid mobilen till liggande läge för att spela.</div></div><script src="cards.js"></script><script>
const decks=[{name:'Inferno',ids:['cindervyx','pyrolith','moltrex','emberquill','terranox','boulderhorn']},{name:'Tidvatten',ids:['aqualune','nerith','mistleap','cry ozar','frostlyn','zephyrax']},{name:'Vildmark',ids:['florami','brambleon','thornkit','verdantis','terranox','boulderhorn']},{name:'Skymning',ids:['shadowmire','noctaris','astrail','lumivolt','voltique','glimmerfin']}];decks[1].ids[3]='cryozar';
const byId=Object.fromEntries(CARDS.map(c=>[c.id,c]));let state=null,lock=false,noticeTimer;
const $=id=>document.getElementById(id);function showMenu(){$('overlay').style.display='flex';$('deckmenu').innerHTML=decks.map((d,i)=>`<button class="deckbtn" onclick="start(${i})">${d.name}<small>${d.ids.length} varelser</small></button>`).join('')};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function unit(id){const c=byId[id];return {id,uid:Math.random().toString(36).slice(2),hp:c.maxHp,used:false}};
function start(idx){const opp=(idx+1+Math.floor(Math.random()*3))%4;state={deck:idx,enemyDeck:opp,draw:shuffle(decks[idx].ids).map(unit),edraw:shuffle(decks[opp].ids).map(unit),hand:[],ehand:[],mine:[null,null,null],enemy:[null,null,null],energy:2,round:1,sel:null,target:null,phase:'player',over:false};for(let i=0;i<4;i++){draw('mine');draw('enemy')}for(let i=0;i<2;i++)placeAI();$('overlay').style.display='none';message('Din tur – spela ett kort!',1200);render()}
function draw(side){let pile=side==='mine'?state.draw:state.edraw;let hand=side==='mine'?state.hand:state.ehand;if(pile.length&&hand.length<5)hand.push(pile.shift())}
function placeAI(){const slot=state.enemy.findIndex(x=>!x);if(slot<0||!state.ehand.length)return;state.enemy[slot]=state.ehand.shift()}
function play(i){if(!state||state.phase!=='player'||lock)return;let slot=state.mine.findIndex(x=>!x);if(slot<0){message('Alla tre platser är upptagna');return}state.mine[slot]=state.hand.splice(i,1)[0];state.sel=slot;render()}
function selectMine(i){if(state.mine[i]&&state.phase==='player'){state.sel=i;render()}}function selectTarget(i){if(state.enemy[i]&&state.phase==='player'){state.target=i;render()}}
function faceHtml(u){const c=byId[u.id];return `<div class="cardtitle"><span>${c.name}</span><b class="hpbadge">♥ ${u.hp}</b></div><img src="${c.image}" alt="${c.name}"><div class="attacklist">${c.attacks.map(a=>`<div class="attackline"><span class="gems" aria-label="${a.energy} energi">${'◆'.repeat(a.energy)}</span><span class="attackname">${a.name}</span><b class="damagebadge">${a.damage}</b></div>`).join('')}</div><div class="health"><div class="fill" style="width:${Math.max(0,u.hp/c.maxHp*100)}%"></div></div>`}
function cardHtml(u,side,i){if(!u)return `<div class="slot">+</div>`;const sel=side==='mine'&&state.sel===i,target=side==='enemy'&&state.target===i;return `<div class="card ${sel?'selected':''} ${target?'target':''}" id="${side}${i}" onclick="${side==='mine'?`selectMine(${i})`:`selectTarget(${i})`}">${faceHtml(u)}</div>`}
function render(){if(!state)return;$('enemyrow').innerHTML=state.enemy.map((u,i)=>cardHtml(u,'enemy',i)).join('');$('myrow').innerHTML=state.mine.map((u,i)=>cardHtml(u,'mine',i)).join('');$('hand').innerHTML=state.hand.map((u,i)=>`<button class="handcard" onclick="play(${i})" aria-label="Spela ${byId[u.id].name}">${faceHtml(u)}</button>`).join('');$('enemyhud').textContent=`${decks[state.enemyDeck].name} · ${state.edraw.length+state.ehand.length+state.enemy.filter(Boolean).length} kvar`;$('myhud').textContent=`${decks[state.deck].name} · ${state.draw.length+state.hand.length+state.mine.filter(Boolean).length} kvar · ◆ ${state.energy}/5`;$('turn').textContent=`Runda ${state.round} · ${state.phase==='player'?'Din tur':'Motståndaren'}`;const u=state.mine[state.sel],c=u&&byId[u.id];$('info').innerHTML=c?`<b>${c.name}</b><br>${c.attacks.map(a=>`${a.name}: ◆${a.energy} → ${a.damage}`).join('<br>')}`:'Välj ett av dina kort och sedan en motståndare.';[0,1].forEach(i=>{let b=$('a'+(i+1));b.textContent=c?`${c.attacks[i].name} (${c.attacks[i].damage})`:`Attack ${i+1}`;b.disabled=!c||u.used||state.energy<c.attacks[i].energy||state.phase!=='player'||state.over||lock});$('end').disabled=state.phase!=='player'||state.over||lock}
function message(t,ms=1200){$('notice').textContent=t;$('notice').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').style.display='none',ms)}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function deal(side,index,dmg){const u=state[side][index];if(!u)return;let node=$(side+index);node.classList.add('hit');let num=document.createElement('div');num.className='damage';num.textContent='−'+dmg;node.appendChild(num);u.hp=Math.max(0,u.hp-dmg);node.querySelector('.hpbadge').textContent=`♥ ${u.hp}`;node.querySelector('.fill').style.width=(u.hp/byId[u.id].maxHp*100)+'%';await wait(900);if(u.hp<=0){state[side][index]=null;message(`${byId[u.id].name} utslagen!`,750)}render()}
async function attack(k){if(!state||state.phase!=='player'||lock)return;const u=state.mine[state.sel];if(!u||u.used)return;const a=byId[u.id].attacks[k];if(state.energy<a.energy)return;let t=state.target;if(t==null||!state.enemy[t])t=state.enemy.findIndex(Boolean);if(t<0){message('Motståndaren har inga kort på banan');return}lock=true;state.energy-=a.energy;u.used=true;await deal('enemy',t,a.damage);lock=false;checkEnd();render()}
function checkEnd(){if(!state)return false;if(!state.enemy.some(Boolean)&&!state.edraw.length&&!state.ehand.length){state.over=true;state.phase='done';message('Du vann! Välj Ny match för att spela igen.',999999);return true}if(!state.mine.some(Boolean)&&!state.draw.length&&!state.hand.length){state.over=true;state.phase='done';message('Motståndaren vann! Försök igen.',999999);return true}return false}
async function endTurn(){if(!state||state.phase!=='player'||lock||state.over)return;lock=true;state.phase='enemy';render();await wait(350);draw('enemy');placeAI();let attackers=state.enemy.filter(Boolean);for(let u of attackers){if(state.over)break;let idx=state.mine.findIndex(Boolean);if(idx<0)break;let enemyCard=byId[u.id],a=enemyCard.attacks[Math.random()<.4?1:0];message(`${enemyCard.name}: ${a.name}!`,650);await wait(350);await deal('mine',idx,a.damage);if(checkEnd())break}if(!state.over){state.round++;state.phase='player';state.energy=Math.min(5,2+Math.floor(state.round/2));state.mine.forEach(u=>{if(u)u.used=false});draw('mine');message('Din tur!',750)}lock=false;render()}
// Original, softly plucked pentatonic loop generated locally; no downloads.
let musicContext, musicBus, musicTimer, musicStep=0, musicEnabled=false;
const melody=[0,7,12,14,12,7,4,7,2,9,14,16,14,9,7,2,4,11,16,19,16,11,7,4,2,7,14,12,9,7,4,2];
function musicNote(semitone,duration,volume){
 const t=musicContext.currentTime, osc=musicContext.createOscillator(), gain=musicContext.createGain();
 osc.type='sine';osc.frequency.value=220*Math.pow(2,semitone/12);
 gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.025);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 osc.connect(gain);gain.connect(musicBus);osc.start(t);osc.stop(t+duration+.05);
 osc.onended=()=>{osc.disconnect();gain.disconnect()};
}
function musicTick(){if(!musicEnabled||document.hidden)return;
 musicNote(melody[musicStep%melody.length],.85,.14);
 if(musicStep%8===0){const root=[-12,-10,-8,-10][Math.floor(musicStep/8)%4];musicNote(root,2.7,.12);musicNote(root+7,2.7,.05)}
 musicStep++;}
async function toggleMusic(){try{
 if(!musicContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('audio');musicContext=new Audio();musicBus=musicContext.createGain();musicBus.gain.value=.3;musicBus.connect(musicContext.destination)}
 if(musicEnabled){musicEnabled=false;clearInterval(musicTimer);await musicContext.suspend()}
 else {await musicContext.resume();musicEnabled=true;musicTick();musicTimer=setInterval(musicTick,420)}
 $('music').textContent=musicEnabled?'♫ Musik: på':'♫ Musik: av';$('music').setAttribute('aria-pressed',String(musicEnabled));
 }catch(e){musicEnabled=false;clearInterval(musicTimer);message('Musik kunde inte startas. Tryck igen.')}}
document.addEventListener('visibilitychange',()=>{if(musicContext&&musicEnabled){if(document.hidden)musicContext.suspend();else musicContext.resume().catch(()=>{})}});
showMenu();
</script></body></html>
