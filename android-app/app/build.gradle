plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elementalduel.game'
    compileSdk 35

    // Public development key: stable across local and CI test builds.
    // Never use this key for production or Google Play releases.
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.elementalduel.game'
        minSdk 24
        targetSdk 28
        versionCode providers.gradleProperty('versionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('0.2')
    }
}
