plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elementalduel.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elementalduel.game'
        minSdk 24
        targetSdk 28
        versionCode providers.gradleProperty('versionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('0.2')
    }
}
